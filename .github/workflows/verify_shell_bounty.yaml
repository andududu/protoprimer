name: Verify shell bounty on fork
on:
  push:
    branches: [verify-posix-sh-fallback]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            environment: min
          - python: '3.14'
            environment: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ./prime --env dst/test_python_${{ matrix.environment }}
      # The manual fetches the current branch from a hardcoded upstream URL.
      # Resolve it to this fork, which actually contains the branch under test.
      - run: git config --global url.https://github.com/andududu/protoprimer.git.insteadOf https://github.com/uvsmtid/protoprimer.git
      - run: ./venv/bin/python -m pytest
        env:
          CI: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
